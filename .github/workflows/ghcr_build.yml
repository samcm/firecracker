name: ghcr-build

on:
  push:
    branches:
      - "mem-backend-shared-*"
      - "tsc-*"
      - "live-branch-*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted x86_64 ubuntu runners expose /dev/kvm (nested virt);
      # the devctr runs privileged with /dev bind-mounted, so KVM-backed
      # vmm tests execute for real here.
      - name: Check KVM availability
        run: ls -l /dev/kvm

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Run vmm tests (devtool, KVM)
        run: ./tools/devtool -y sh "RUST_TEST_THREADS=1 cargo test -p vmm --target x86_64-unknown-linux-musl --no-fail-fast"

  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firecracker + jailer (devtool, musl release)
        run: ./tools/devtool -y build --release

      - name: Stage image context
        run: |
          mkdir -p out
          cp build/cargo_target/x86_64-unknown-linux-musl/release/firecracker out/
          cp build/cargo_target/x86_64-unknown-linux-musl/release/jailer out/
          # busybox base (not scratch) so consumers can extract the binary
          # with an initContainer running /bin/cp.
          cat > out/Dockerfile <<'EOF'
          FROM busybox:stable-musl@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
          COPY firecracker /firecracker
          COPY jailer /jailer
          EOF

      - name: Upload raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: firecracker-binaries
          path: |
            out/firecracker
            out/jailer
          if-no-files-found: error

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/firecracker"
          BRANCH="${GITHUB_REF_NAME}"
          SHA7="${GITHUB_SHA::7}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMG}:${BRANCH}" \
            -t "${IMG}:${BRANCH}-${SHA7}" \
            out
          docker push "${IMG}:${BRANCH}"
          docker push "${IMG}:${BRANCH}-${SHA7}"
