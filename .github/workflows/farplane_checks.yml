name: Farplane checks

on:
  pull_request:
  push:
    branches:
      - farplane
  # The functional lane runs only when it is asked for, on a runner that has the devices.
  # An ordinary run has no such host, and a job that reported success there would look like
  # proof of KVM behaviour that never executed.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for the functional lane; needs /dev/kvm, /dev/userfaultfd and a kernel of at least 6.1"
        required: false
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: farplane-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no KVM, no userfaultfd and no guest: the memory channel wire
  # format, the capture command state machine, the vsock device and its snapshot state.
  # An ordinary runner and no container, so this stays the gate for ordinary changes.
  unit_and_wire:
    name: unit and wire tests
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install the pinned toolchain"
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - name: "Farplane memory channel and capture tests"
        run: cargo test -p vmm --lib vstate::farplane

      - name: "Vsock device and snapshot state tests"
        run: cargo test -p vmm --lib vsock

      - name: "Memory channel wire tests"
        run: cargo test -p vmm --test farplane_channel

      - name: "Clippy over the crate the fork changes"
        run: cargo clippy -p vmm --lib --tests -- -D warnings

      - name: "Install the Python test requirements"
        run: python3 -m pip install --break-system-packages pytest requests requests-unixsocket

      # `--confcutdir` keeps the session conftest out: it wants a built binary and the test
      # artifacts, and these tests read only checked-in sources.
      - name: "Cross-language wire tests"
        working-directory: tests
        run: >
          python3 -m pytest -q
          --confcutdir=integration_tests/build
          integration_tests/build/test_farplane_wire.py

  # The fork ships on both architectures. `checkbuild` is the repository's own cross
  # compile path: clippy over every target of the workspace, on the GNU target because
  # musl does not cross-compile cleanly. It runs in the public dev container, so it needs
  # no toolchain of its own.
  #
  # This lane compiles for aarch64 and does not execute tests there. Running them needs an
  # aarch64 runner, and emulating one under qemu-user would report a pass for a machine the
  # fork never runs on, which is worse than the gap. The architecture-dependent wire values
  # are covered instead by fixtures for both `hello` frames, which the x86_64 lane checks.
  # Executing the suite natively on aarch64 stays a manual step until a runner exists.
  aarch64_compile:
    name: aarch64 compile check
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Cross compile check for aarch64"
        run: ./tools/devtool -y checkbuild -m aarch64

  # Functional proof of the parts that need host devices: userfaultfd for the guest
  # mappings, KVM for the dirty log and the vCPUs. It is a separate lane on purpose, it
  # never runs on a pull request, and it fails rather than passing where the devices are
  # absent: the only green this job can produce is one that ran the tests.
  kvm_functional:
    name: KVM and userfaultfd functional tests
    if: github.event_name == 'workflow_dispatch'
    # The fallback keeps the expression valid on the events where this job is skipped.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Require the devices and the kernel the functional tests need"
        run: |
          kernel=$(uname -r | cut -d- -f1)
          major=${kernel%%.*}
          rest=${kernel#*.}
          minor=${rest%%.*}
          echo "kernel=$kernel kvm=$([ -c /dev/kvm ] && echo yes || echo no)" \
               "userfaultfd=$([ -c /dev/userfaultfd ] && echo yes || echo no)"
          missing=""
          [ -c /dev/kvm ] || missing="$missing /dev/kvm"
          [ -c /dev/userfaultfd ] || missing="$missing /dev/userfaultfd"
          [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 1 ]; } \
            || missing="$missing kernel>=6.1(have $kernel)"
          if [ -n "$missing" ]; then
            echo "::error::this host cannot run the functional farplane tests; missing:$missing"
            exit 1
          fi

      - name: "Build the binaries the functional tests drive"
        run: ./tools/devtool -y build --release

      - name: "Functional farplane tests"
        run: ./tools/devtool -y test --no-build -- integration_tests/functional/test_farplane.py
