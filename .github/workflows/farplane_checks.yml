name: Farplane checks

on:
  pull_request:
  push:
    branches:
      - farplane
  # The functional lane needs a host that exposes /dev/kvm and /dev/userfaultfd, so it runs
  # only when it is dispatched with a runner label that names such a host.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for the functional lane. The host must expose /dev/kvm and /dev/userfaultfd and run a kernel of at least 6.1; a hosted ubuntu runner does not."
        required: true

permissions:
  contents: read

concurrency:
  group: farplane-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no KVM, no userfaultfd and no guest: the memory channel wire
  # format, the capture command state machine, the vsock device and its snapshot state.
  # An ordinary runner and no container, so this stays the gate for ordinary changes.
  unit_and_wire:
    name: unit and wire tests
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Install the pinned toolchain"
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      # `src/seccompiler/build.rs` emits `cargo::rustc-link-lib=static=seccomp`, so anything that
      # links the seccompiler library needs libseccomp present at link time. Here that is
      # the `firecracker` build script, which compiles the seccomp policies through
      # seccompiler as a library: without the package its link ends in `unable to find
      # library -lseccomp` and takes `-p firecracker` with it. The dev container carries a
      # static libseccomp under /usr/local/lib; a hosted runner carries none.
      - name: "Install the libseccomp the firecracker build script links"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      # A release supplies its own audited libseccomp through LIBSECCOMP_LIB_PATH, and the
      # linker searches its default directories after every `-L`, so a build script that
      # ignored that variable would link a host copy and still succeed. The directives the
      # script prints are where that choice is made, so they are what this asserts: the
      # supplied directory when there is one, /usr/local/lib when there is none, and a
      # refusal when the supplied directory holds no library. The script uses nothing but
      # std, so it compiles and runs on its own.
      #
      # This is unit coverage of the build script's own logic. It says nothing about the
      # shipped build: it runs the script directly, outside devtool and its container. The
      # provenance of the libseccomp the released binaries link is proved in
      # `aarch64_musl_build`.
      - name: "The seccompiler link search follows LIBSECCOMP_LIB_PATH"
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          rustc --edition 2024 -o "$work/build-script" src/seccompiler/build.rs

          private="$work/private-lib"
          mkdir "$private"
          : > "$private/libseccomp.a"
          supplied=$(LIBSECCOMP_LIB_PATH="$private" "$work/build-script")
          echo "$supplied"
          grep -qxF "cargo::rerun-if-env-changed=LIBSECCOMP_LIB_PATH" <<<"$supplied"
          grep -qxF "cargo::rustc-link-search=native=$private" <<<"$supplied"
          grep -qxF "cargo::rustc-link-lib=static=seccomp" <<<"$supplied"
          if grep -qF "/usr/local/lib" <<<"$supplied"; then
            echo "::error::the supplied path did not replace the default link search path"
            exit 1
          fi

          default=$(env -u LIBSECCOMP_LIB_PATH "$work/build-script")
          echo "$default"
          grep -qxF "cargo::rustc-link-search=native=/usr/local/lib" <<<"$default"
          grep -qxF "cargo::rustc-link-lib=static=seccomp" <<<"$default"

          shared_only="$work/shared-only"
          mkdir "$shared_only"
          : > "$shared_only/libseccomp.so"
          if LIBSECCOMP_LIB_PATH="$shared_only" "$work/build-script"; then
            echo "::error::the build script accepted a shared-only supplied library"
            exit 1
          fi

          holds_nothing="$work/holds-nothing"
          mkdir "$holds_nothing"
          if LIBSECCOMP_LIB_PATH="$holds_nothing" "$work/build-script"; then
            echo "::error::the build script took a directory that holds no libseccomp"
            exit 1
          fi
          echo "the link search follows the supplied path and refuses a directory without one"

      # Directives alone do not prove which file the linker opened: its default search
      # directories follow every explicit `-L`. Build the real seccompiler binary in an
      # isolated target directory and require GNU ld's link map to name the supplied
      # library. Rustc consumes a successful linker's stdout, so `-Wl,-t` never reaches the
      # cargo log. The map is a durable linker output instead. A single build job prevents
      # dependency linkers from racing to overwrite it before the final binary is linked.
      #
      # This is a debug GNU host build of one workspace binary, driven by cargo directly.
      # It proves the build script's directives are honoured by a linker; it is not the
      # path a release takes, and it is not evidence about one.
      - name: "The seccompiler binary links the supplied libseccomp"
        run: |
          set -euo pipefail
          private=$(mktemp -d)
          supplied=$(cc -print-file-name=libseccomp.a)
          shared=$(cc -print-file-name=libseccomp.so)
          if [ "$supplied" = libseccomp.a ] || [ ! -f "$supplied" ]; then
            echo "::error::the installed libseccomp development package exposed no static library"
            exit 1
          fi
          cp -L "$supplied" "$private/libseccomp.a"
          if [ "$shared" = libseccomp.so ] || [ ! -f "$shared" ]; then
            echo "::error::the installed libseccomp development package exposed no shared-library decoy"
            exit 1
          fi
          cp -L "$shared" "$private/libseccomp.so"

          target=$(mktemp -d)
          map=$(mktemp)
          LIBSECCOMP_LIB_PATH="$private" \
            CARGO_TARGET_DIR="$target" \
            CARGO_BUILD_JOBS=1 \
            RUSTFLAGS="-C link-arg=-Wl,-Map=$map" \
            cargo build -p seccompiler --bin seccompiler-bin -vv
          grep -qF "$private/libseccomp.a" "$map"
          if grep -qF "$private/libseccomp.so" "$map"; then
            echo "::error::the linker selected the shared library beside the supplied archive"
            exit 1
          fi
          test -x "$target/debug/seccompiler-bin"
          echo "the linker opened $private/libseccomp.a"

      # `cargo test <filter>` exits 0 when the filter selects nothing, and a sum taken over
      # several modules stays green when one of them stops existing.
      # `guarded_cargo_test <min> <cargo args...>` pipes cargo through `tee`, keeps cargo's
      # own exit status (`set -o pipefail`, which a GitHub `run:` block does not set), sums
      # the `N passed` counts of libtest's `test result:` summary lines and fails when that
      # sum is below `<min>`. Every required module is invoked on its own with its own
      # floor, so a renamed, deleted or `#[cfg]`-ed out module takes its own suite below its
      # floor instead of shrinking an aggregate.
      #
      # Arguments after `--` reach libtest. The vsock device family runs single-threaded
      # because `devices::virtio::vsock::unix::muxer::tests::{test_muxer_killq,
      # test_vsock_basic_metrics}` assert absolute values of the process-global `METRICS`
      # counters, which the other muxer tests also move. Its filter is the module path and
      # not the bare word `vsock`, which additionally selects
      # `builder::tests::test_attach_vsock_device` (opens /dev/kvm) and
      # `resources::tests::test_set_vsock_device` (opens /dev/net/tun).
      #
      # The two closing invocations fail unless the guard rejects them: a filter that
      # matches nothing, and a real filter carrying an unreachable floor. There is one copy
      # of the guard, so both proofs exercise the function the suites above run through.
      - name: "Filtered Rust suites, guarded by a per-suite floor"
        run: |
          set -euo pipefail

          guarded_cargo_test() {
            local min=$1 log passed
            shift
            log=$(mktemp)
            if ! cargo test "$@" 2>&1 | tee "$log"; then
              echo "guard: cargo test $* exited nonzero"
              rm -f "$log"
              return 1
            fi
            passed=$(sed -n 's/^test result: [A-Za-z]*\. \([0-9][0-9]*\) passed;.*/\1/p' "$log" \
              | awk '{ total += $1 } END { print total + 0 }')
            rm -f "$log"
            if [ "$passed" -lt "$min" ]; then
              echo "guard: cargo test $* executed $passed tests, fewer than the required $min"
              return 1
            fi
            echo "guard: cargo test $* executed $passed tests, the floor is $min"
          }

          guarded_cargo_test 3 -p vmm --lib vstate::farplane::dispatch
          guarded_cargo_test 20 -p vmm --lib vstate::farplane::capture
          guarded_cargo_test 13 -p vmm --lib vstate::farplane::backend
          guarded_cargo_test 13 -p vmm --lib vstate::farplane::protocol
          guarded_cargo_test 15 -p vmm --lib devices::virtio::vsock::device
          guarded_cargo_test 14 -p vmm --lib devices::virtio::vsock::event_handler
          guarded_cargo_test 11 -p vmm --lib devices::virtio::vsock::persist
          guarded_cargo_test 11 -p vmm --lib snapshot::
          guarded_cargo_test 25 -p vmm --test farplane_channel
          guarded_cargo_test 1 -p firecracker --bin firecracker api_server_adapter
          # One image-alias test briefly redirects stderr, so the jailer crate runs
          # single-threaded rather than exposing process-global fd 2 to another test.
          guarded_cargo_test 28 -p jailer -- --test-threads=1

          # Pin the whole family as well as its three Farplane-specific modules, so
          # deleting a muxer, packet, or connection-state test cannot hide in the
          # still-large aggregate.
          guarded_cargo_test 83 -p vmm --lib devices::virtio::vsock -- --test-threads=1

          if guarded_cargo_test 1 -p vmm --lib vstate::farplane::this_filter_matches_nothing; then
            echo "::error::the guard accepted a filter that selects no tests"
            exit 1
          fi
          echo "the guard rejected a filter that selects nothing, as it must"

          if guarded_cargo_test 100000 -p vmm --lib vstate::farplane::dispatch; then
            echo "::error::the guard accepted a suite that executed fewer tests than its floor"
            exit 1
          fi
          echo "the guard rejected a suite below its floor, as it must"

      - name: "Clippy over the crates the fork changes"
        run: |
          cargo clippy -p vmm --lib --tests -- -D warnings
          cargo clippy -p jailer --all-targets -- -D warnings

      # Distributions and versions come from tools/devctr/poetry.lock, the set the suite
      # resolves to in the dev container: pytest and pytest-json-report for the
      # `--json-report` that tests/pytest.ini pins in `addopts`, pytest-timeout for its
      # `timeout = 300`, and what the test module imports through `host_tools.farplane`,
      # which reaches `framework/http_api.py` (requests, and requests-unixsocket2, whose
      # module name is `requests_unixsocket`) and through it
      # `framework/swagger_validator.py` (PyYAML, jsonschema).
      - name: "Install the Python test requirements"
        run: >
          python3 -m pip install --break-system-packages
          pytest==9.0.3 pytest-json-report==1.5.0 pytest-timeout==2.4.0
          requests==2.33.1 requests-unixsocket2==0.4.2
          PyYAML==6.0.3 jsonschema==4.26.0

      # `--confcutdir` keeps the session conftest out: it wants a built binary and the test
      # artifacts, and these tests read only checked-in sources. `python3 -m pytest`, unlike
      # `pytest`, puts the working directory on `sys.path`, which is what resolves
      # `import host_tools.farplane` without that conftest.
      #
      # tests/pytest.ini points `--json-report` at the suite-wide `../test_results` path;
      # this run redirects the report to a path of its own and reads the executed-test count
      # back out of it. pytest exits 5 rather than failing when nothing is collected, so the
      # count is asserted against a floor as well: the module declares four test functions,
      # one of them parametrized over two fixtures, so it executes five tests.
      - name: "Cross-language wire tests"
        working-directory: tests
        run: |
          set -euo pipefail
          report="$(mktemp -d)/wire-report.json"
          status=0
          python3 -m pytest -q \
            --confcutdir=integration_tests/build \
            --json-report --json-report-file="$report" \
            integration_tests/build/test_farplane_wire.py || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the farplane wire tests exited $status"
            exit "$status"
          fi
          if [ ! -f "$report" ]; then
            echo "::error::pytest wrote no json report; the session did not reach its end"
            exit 1
          fi
          executed=$(python3 -c \
            'import json,sys; print(len(json.load(open(sys.argv[1])).get("tests", [])))' \
            "$report")
          if [ "$executed" -lt 5 ]; then
            echo "::error::the wire tests executed $executed of the 5 tests the module declares"
            exit 1
          fi
          echo "the wire tests executed $executed tests"

  # The fork ships musl binaries. `tools/devtool build` defaults to `--libc musl`
  # (tools/devtool:501) and hands the profile to `tools/release.sh`, which derives its
  # target from the host architecture: `ARCH=$(uname -m)` and
  # `CARGO_TARGET=$ARCH-unknown-linux-$LIBC` (tools/release.sh:105-108), then runs
  # `cargo build --target "$CARGO_TARGET" --workspace --bins --examples`
  # (tools/release.sh:136). musl is the only libc for which that build includes jailer
  # (tools/release.sh:125-132). The target is host-derived, so aarch64 musl binaries come
  # from an aarch64 host: this lane uses the GitHub-hosted arm64 runner, where the dev
  # container already carries the aarch64 musl rust target (tools/devctr/Dockerfile:213).
  # This lane compiles and links only; a hosted runner has no /dev/kvm, so the functional
  # suites cannot execute here.
  aarch64_musl_build:
    name: aarch64 musl build of firecracker and jailer
    runs-on: ubuntu-24.04-arm
    # Bounds the build once a runner picks the job up, so a broken label or a stuck
    # container build ends instead of holding the lane.
    timeout-minutes: 90
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The musl target follows `uname -m`, so a non-aarch64 host here would build and
      # green the wrong triple.
      - name: "Require an aarch64 host"
        run: |
          set -euo pipefail
          arch=$(uname -m)
          if [ "$arch" != "aarch64" ]; then
            echo "::error::this lane must run on aarch64; uname -m reports $arch"
            exit 1
          fi

      # The library a release supplies is a host path outside the checkout. The repository is
      # mounted into the dev container at /firecracker, not at its host path, so a directory
      # under the runner's temporary space reaches the build through nothing but the explicit
      # `--volume` and `--env` that `run_devctr` adds for LIBSECCOMP_LIB_PATH
      # (tools/devtool:349-355). The container is the only place the library exists, so it is
      # staged into the checkout first and moved out on the host.
      - name: "Prepare a caller-supplied libseccomp outside the checkout"
        run: |
          set -euo pipefail
          ./tools/devtool -y sh 'cp /usr/local/lib/libseccomp.a build/libseccomp-staged.a'
          private=$(mktemp -d)
          mv build/libseccomp-staged.a "$private/libseccomp.a"
          chmod 0755 "$private"
          echo "LIBSECCOMP_PRIVATE_DIR=$private" >> "$GITHUB_ENV"
          echo "staged the caller-supplied libseccomp in $private"

      - name: "Build the musl binaries the fork ships"
        run: |
          set -euo pipefail
          LIBSECCOMP_LIB_PATH="$LIBSECCOMP_PRIVATE_DIR" \
            ./tools/devtool -y build --release --libc musl

      # What consumes libseccomp in a release is a host artifact: `seccompiler` is a build
      # dependency of `firecracker` (src/firecracker/Cargo.toml), so the directives
      # `src/seccompiler/build.rs` prints are applied when cargo links firecracker's build
      # script for the host. Cargo records that script's own emitted directives next to it,
      # and the recorded search path is the one the release used: a devtool that stopped
      # forwarding the variable would leave the build script on its /usr/local/lib default
      # and record that instead, while a devtool that stopped mounting the directory would
      # fail the build script's own existence assertion.
      - name: "The release build script searched the supplied directory"
        run: |
          set -euo pipefail
          recorded=$(grep -rlF "cargo::rustc-link-search=native=$LIBSECCOMP_PRIVATE_DIR" \
            build/cargo_target/release/build/*/output || true)
          if [ -z "$recorded" ]; then
            echo "::error::no release build script recorded a link search of $LIBSECCOMP_PRIVATE_DIR"
            grep -rhF "cargo::rustc-link-search=native=" \
              build/cargo_target/release/build/*/output || true
            exit 1
          fi
          echo "the release build recorded the supplied search path in:"
          echo "$recorded"

      # The recorded directive is where the choice is made, not proof the linker took it: the
      # linker searches its own default directories, which hold the container's copy, after
      # every explicit `-L`. So repeat the production command with the supplied directory
      # holding an unusable archive. The build must fail. A build that succeeds linked a
      # libseccomp the caller did not supply, which is the whole failure this lane exists to
      # catch, and it is also what a devtool that stopped forwarding the variable would do.
      #
      # The build script accepts the directory (it checks for the file, not its contents), so
      # the failure comes from the link. The target directory is populated by the step above,
      # so only what depends on the changed variable is rebuilt.
      #
      # A nonzero exit alone would also be produced by a container that failed to start or a
      # compile error, so the expected failure is identified rather than assumed: the log must
      # name the supplied archive and must fail at the link step. Anything else exits with the
      # build's own status as an unrelated breakage instead of greening this assertion.
      - name: "The release link consumes the supplied library and no other"
        run: |
          set -euo pipefail
          broken=$(cd "$(mktemp -d)" && pwd -P)
          chmod 0755 "$broken"
          echo "not an archive" > "$broken/libseccomp.a"
          status=0
          LIBSECCOMP_LIB_PATH="$broken" \
            ./tools/devtool -y build --release --libc musl > broken-build.log 2>&1 || status=$?
          tail -40 broken-build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the release build succeeded with an unusable libseccomp in $broken, so"
            echo "::error::the linker resolved -lseccomp somewhere the caller did not supply"
            exit 1
          fi
          if grep -qF "holds no libseccomp.a" broken-build.log; then
            echo "::error::the build script refused the directory, so the link was never reached"
            exit 1
          fi
          if ! grep -qF "$broken/libseccomp.a" broken-build.log; then
            echo "::error::nothing in the failed build named $broken/libseccomp.a, so the failure"
            echo "::error::was not the linker rejecting the library the caller supplied"
            exit "$status"
          fi
          if ! grep -qF "error: linking with" broken-build.log; then
            echo "::error::the build failed before the link, so it says nothing about which"
            echo "::error::libseccomp the release links"
            exit "$status"
          fi
          echo "the release build failed on the unusable supplied library, as it must"

      # The other half of the same question, and the failure a broken devtool produces: the
      # supplied directory reaches the build only through the explicit `--volume` and `--env`
      # that `run_devctr` adds (tools/devtool:349-355), and a build that stopped receiving
      # either would take the build script's /usr/local/lib default, link the container's own
      # copy and succeed. A directory holding no library makes that fallback visible, because
      # the build script asserts the supplied directory holds one (src/seccompiler/build.rs:30).
      #
      # So the release must fail here, and fail with that refusal naming this directory: a
      # success means the release linked a libseccomp the caller never supplied, and a failure
      # without the refusal is an unrelated breakage rather than the provenance proof.
      - name: "The release refuses a supplied directory that holds no libseccomp"
        run: |
          set -euo pipefail
          empty=$(cd "$(mktemp -d)" && pwd -P)
          chmod 0755 "$empty"
          status=0
          LIBSECCOMP_LIB_PATH="$empty" \
            ./tools/devtool -y build --release --libc musl > empty-build.log 2>&1 || status=$?
          tail -40 empty-build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the release build succeeded with no libseccomp in $empty, so it linked"
            echo "::error::a library the caller did not supply"
            exit 1
          fi
          if ! grep -qF \
            "$empty, which holds no libseccomp.a" empty-build.log; then
            echo "::error::the release build failed without refusing $empty, so the failure was"
            echo "::error::something other than the missing caller-supplied library"
            exit "$status"
          fi
          echo "the release refused a supplied directory that holds no libseccomp, as it must"

      # Restore the good library, so the artifacts the assertions below read are the ones the
      # first build produced rather than a half-finished failed build.
      - name: "Rebuild the musl binaries with the supplied libseccomp"
        run: |
          set -euo pipefail
          LIBSECCOMP_LIB_PATH="$LIBSECCOMP_PRIVATE_DIR" \
            ./tools/devtool -y build --release --libc musl

      # `release.sh` names the output directory after the target triple
      # (tools/release.sh:108-109), so reading that path asserts what the build selected:
      # both binaries must exist there and `file` must report aarch64 static ELF rather
      # than a host-architecture or dynamically linked build.
      - name: "Assert firecracker and jailer are aarch64 musl static binaries"
        run: |
          set -euo pipefail
          out=build/cargo_target/aarch64-unknown-linux-musl/release
          for binary in firecracker jailer; do
            if [ ! -f "$out/$binary" ]; then
              echo "::error::$out/$binary was not produced"
              exit 1
            fi
            described=$(file -L "$out/$binary")
            echo "$binary: $described"
            case "$described" in
              *"ARM aarch64"*) ;;
              *) echo "::error::$binary is not an aarch64 ELF: $described"; exit 1 ;;
            esac
            case "$described" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::$binary is not statically linked: $described"; exit 1 ;;
            esac
          done

  # `devtool checkbuild` runs clippy over every workspace target for the requested
  # architecture against the *GNU* triple, which devtool hardcodes for cross builds
  # because musl does not cross-compile cleanly (tools/devtool:1249-1250). It type-checks
  # and lints the aarch64 code and links nothing, so it says nothing about the musl
  # binaries; the musl proof is the `aarch64_musl_build` job.
  #
  # The clippy invocation below is the one `devtool checkbuild -m aarch64` runs
  # (tools/devtool:1250), without the dev container around it. devtool runs every command
  # inside `public.ecr.aws/firecracker/fcuvm`, whose anonymous pull is rate-limited per
  # source address and answers `toomanyrequests` often enough on a shared hosted runner to
  # decide this lane. Nothing here needs that container: clippy emits metadata and links no
  # Rust artifact for the target, so the aarch64 GNU toolchain is a rustup target plus the
  # cross C toolchain the step below installs. The musl binaries still come out of the
  # container, in `aarch64_musl_build`.
  aarch64_gnu_checkbuild:
    name: aarch64 GNU cross clippy (devtool checkbuild)
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Install the pinned toolchain and the aarch64 GNU target"
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
          rustup target add aarch64-unknown-linux-gnu

      # Two native pieces the dev container would otherwise provide. `vmm` depends on
      # `aws-lc-rs`, whose `aws-lc-sys` build script compiles C for the *target*, so the
      # aarch64 cross toolchain from tools/devctr/Dockerfile:158-166 has to be here, along
      # with the cmake and clang that build drives. libseccomp is for the host side: the
      # `firecracker` build script links seccompiler and a build script is always built for
      # the host, whatever `--target` says.
      - name: "Install the cross toolchain and the libseccomp the build scripts need"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libseccomp-dev cmake clang \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      - name: "Cross clippy for the aarch64 GNU target"
        run: >
          cargo clippy --target aarch64-unknown-linux-gnu
          --all --all-targets --all-features -- -D warnings

      # `.cargo/config.toml` sets the target directory and cargo names the subdirectory
      # after the triple, so this path exists only if clippy really checked the aarch64
      # target: a dropped or mistyped `--target` would lint the runner's x86_64 host and
      # produce an otherwise identical green.
      - name: "Assert the aarch64 target is the one that was linted"
        run: |
          set -euo pipefail
          out=build/cargo_target/aarch64-unknown-linux-gnu/debug
          if [ ! -d "$out" ]; then
            echo "::error::clippy produced no $out, so it did not check the aarch64 target"
            exit 1
          fi
          echo "clippy wrote $out"

  # Functional proof of the parts that need host devices: userfaultfd for the guest
  # mappings, KVM for the dirty log and the vCPUs. Manual only, and the precondition step
  # exits nonzero when a device or the kernel version is missing, so the only green this
  # job can produce is one that ran the tests.
  kvm_functional:
    name: KVM and userfaultfd functional tests
    if: github.event_name == 'workflow_dispatch'
    # `inputs.runner` is required on dispatch, so the fallback is reached only on the events
    # where this job is skipped, where it just keeps the expression valid. It names no real
    # runner on purpose: no default can place this job on a host that lacks the devices.
    runs-on: ${{ inputs.runner || 'farplane-functional-runner-unset' }}
    # An unmatched label leaves the job queued until GitHub expires it; this bounds the job
    # once a runner does pick it up, so a capable-looking but wrong host ends the run.
    timeout-minutes: 120
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Require the devices and the kernel the functional tests need"
        run: |
          kernel=$(uname -r | cut -d- -f1)
          major=${kernel%%.*}
          rest=${kernel#*.}
          minor=${rest%%.*}
          echo "kernel=$kernel kvm=$([ -c /dev/kvm ] && echo yes || echo no)" \
               "userfaultfd=$([ -c /dev/userfaultfd ] && echo yes || echo no)"
          missing=""
          [ -c /dev/kvm ] || missing="$missing /dev/kvm"
          [ -c /dev/userfaultfd ] || missing="$missing /dev/userfaultfd"
          [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 1 ]; } \
            || missing="$missing kernel>=6.1(have $kernel)"
          if [ -n "$missing" ]; then
            echo "::error::this host cannot run the functional farplane tests; missing:$missing"
            exit 1
          fi

      - name: "Build the binaries the functional tests drive"
        run: ./tools/devtool -y build --release

      - name: "Functional farplane tests"
        run: ./tools/devtool -y test --no-build -- integration_tests/functional/test_farplane.py
