name: Farplane checks

on:
  pull_request:
  push:
    branches:
      - farplane
  # The functional lane needs a host that exposes /dev/kvm and /dev/userfaultfd, so it runs
  # only when it is dispatched with a runner label that names such a host.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for the functional lane. The host must expose /dev/kvm and /dev/userfaultfd and run a kernel of at least 6.1; a hosted ubuntu runner does not."
        required: true

permissions:
  contents: read

concurrency:
  group: farplane-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no KVM, no userfaultfd and no guest: the memory channel wire
  # format, the capture command state machine, the vsock device and its snapshot state.
  # An ordinary runner and no container, so this stays the gate for ordinary changes.
  unit_and_wire:
    name: unit and wire tests
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install the pinned toolchain"
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      # `cargo test <filter>` exits 0 when the filter selects nothing, so a renamed module
      # would leave these suites green without executing a test. `guarded_cargo_test` pipes
      # cargo through `tee`, keeps cargo's own exit status (`set -o pipefail`, which a
      # GitHub `run:` block does not set), then sums the `N passed` counts of libtest's
      # `test result:` summary lines and fails when that sum is zero.
      #
      # The last invocation passes a filter that matches nothing on purpose and fails
      # unless the guard rejects it, so every run also checks that the guard is fail-closed.
      # There is one copy of the guard: the negative proof calls the same function.
      - name: "Filtered Rust suites, guarded against executing zero tests"
        run: |
          set -euo pipefail

          guarded_cargo_test() {
            local log passed
            log=$(mktemp)
            if ! cargo test "$@" 2>&1 | tee "$log"; then
              echo "guard: cargo test $* exited nonzero"
              rm -f "$log"
              return 1
            fi
            passed=$(sed -n 's/^test result: [A-Za-z]*\. \([0-9][0-9]*\) passed;.*/\1/p' "$log" \
              | awk '{ total += $1 } END { print total + 0 }')
            rm -f "$log"
            if [ "$passed" -eq 0 ]; then
              echo "guard: cargo test $* executed 0 tests; the filter selects nothing"
              return 1
            fi
            echo "guard: cargo test $* executed $passed tests"
          }

          guarded_cargo_test -p vmm --lib vstate::farplane
          guarded_cargo_test -p vmm --lib vsock
          guarded_cargo_test -p vmm --test farplane_channel

          if guarded_cargo_test -p vmm --lib vstate::farplane::this_filter_matches_nothing; then
            echo "::error::the zero-test guard accepted a filter that selects no tests"
            exit 1
          fi
          echo "the zero-test guard rejected a filter that selects nothing, as it must"

      - name: "Clippy over the crate the fork changes"
        run: cargo clippy -p vmm --lib --tests -- -D warnings

      - name: "Install the Python test requirements"
        run: python3 -m pip install --break-system-packages pytest requests requests-unixsocket

      # `--confcutdir` keeps the session conftest out: it wants a built binary and the test
      # artifacts, and these tests read only checked-in sources.
      - name: "Cross-language wire tests"
        working-directory: tests
        run: >
          python3 -m pytest -q
          --confcutdir=integration_tests/build
          integration_tests/build/test_farplane_wire.py

  # The fork ships musl binaries. `tools/devtool build` defaults to `--libc musl`
  # (tools/devtool:501) and hands the profile to `tools/release.sh`, which derives its
  # target from the host architecture: `ARCH=$(uname -m)` and
  # `CARGO_TARGET=$ARCH-unknown-linux-$LIBC` (tools/release.sh:105-108), then runs
  # `cargo build --target "$CARGO_TARGET" --workspace --bins --examples`
  # (tools/release.sh:136). musl is the only libc for which that build includes jailer
  # (tools/release.sh:125-132). The target is host-derived, so aarch64 musl binaries come
  # from an aarch64 host: this lane uses the GitHub-hosted arm64 runner, where the dev
  # container already carries the aarch64 musl rust target (tools/devctr/Dockerfile:213).
  # This lane compiles and links only; a hosted runner has no /dev/kvm, so the functional
  # suites cannot execute here.
  aarch64_musl_build:
    name: aarch64 musl build of firecracker and jailer
    runs-on: ubuntu-24.04-arm
    # Bounds the build once a runner picks the job up, so a broken label or a stuck
    # container build ends instead of holding the lane.
    timeout-minutes: 90
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # The musl target follows `uname -m`, so a non-aarch64 host here would build and
      # green the wrong triple.
      - name: "Require an aarch64 host"
        run: |
          set -euo pipefail
          arch=$(uname -m)
          if [ "$arch" != "aarch64" ]; then
            echo "::error::this lane must run on aarch64; uname -m reports $arch"
            exit 1
          fi

      - name: "Build the musl binaries the fork ships"
        run: ./tools/devtool -y build --release --libc musl

      # `release.sh` names the output directory after the target triple
      # (tools/release.sh:108-109), so reading that path asserts what the build selected:
      # both binaries must exist there and `file` must report aarch64 static ELF rather
      # than a host-architecture or dynamically linked build.
      - name: "Assert firecracker and jailer are aarch64 musl static binaries"
        run: |
          set -euo pipefail
          out=build/cargo_target/aarch64-unknown-linux-musl/release
          for binary in firecracker jailer; do
            if [ ! -f "$out/$binary" ]; then
              echo "::error::$out/$binary was not produced"
              exit 1
            fi
            described=$(file -L "$out/$binary")
            echo "$binary: $described"
            case "$described" in
              *"ARM aarch64"*) ;;
              *) echo "::error::$binary is not an aarch64 ELF: $described"; exit 1 ;;
            esac
            case "$described" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::$binary is not statically linked: $described"; exit 1 ;;
            esac
          done

  # `devtool checkbuild` runs clippy over every workspace target for the requested
  # architecture against the *GNU* triple, which devtool hardcodes for cross builds
  # because musl does not cross-compile cleanly (tools/devtool:1249-1250). It type-checks
  # and lints the aarch64 code and links nothing, so it says nothing about the musl
  # binaries; the musl proof is the `aarch64_musl_build` job.
  aarch64_gnu_checkbuild:
    name: aarch64 GNU cross clippy (devtool checkbuild)
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Cross clippy for the aarch64 GNU target"
        run: ./tools/devtool -y checkbuild -m aarch64

  # Functional proof of the parts that need host devices: userfaultfd for the guest
  # mappings, KVM for the dirty log and the vCPUs. Manual only, and the precondition step
  # exits nonzero when a device or the kernel version is missing, so the only green this
  # job can produce is one that ran the tests.
  kvm_functional:
    name: KVM and userfaultfd functional tests
    if: github.event_name == 'workflow_dispatch'
    # `inputs.runner` is required on dispatch, so the fallback is reached only on the events
    # where this job is skipped, where it just keeps the expression valid. It names no real
    # runner on purpose: no default can place this job on a host that lacks the devices.
    runs-on: ${{ inputs.runner || 'farplane-functional-runner-unset' }}
    # An unmatched label leaves the job queued until GitHub expires it; this bounds the job
    # once a runner does pick it up, so a capable-looking but wrong host ends the run.
    timeout-minutes: 120
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Require the devices and the kernel the functional tests need"
        run: |
          kernel=$(uname -r | cut -d- -f1)
          major=${kernel%%.*}
          rest=${kernel#*.}
          minor=${rest%%.*}
          echo "kernel=$kernel kvm=$([ -c /dev/kvm ] && echo yes || echo no)" \
               "userfaultfd=$([ -c /dev/userfaultfd ] && echo yes || echo no)"
          missing=""
          [ -c /dev/kvm ] || missing="$missing /dev/kvm"
          [ -c /dev/userfaultfd ] || missing="$missing /dev/userfaultfd"
          [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 1 ]; } \
            || missing="$missing kernel>=6.1(have $kernel)"
          if [ -n "$missing" ]; then
            echo "::error::this host cannot run the functional farplane tests; missing:$missing"
            exit 1
          fi

      - name: "Build the binaries the functional tests drive"
        run: ./tools/devtool -y build --release

      - name: "Functional farplane tests"
        run: ./tools/devtool -y test --no-build -- integration_tests/functional/test_farplane.py
