[package]
name = "jailer"
version = "1.16.1"
authors = ["Amazon Firecracker team <firecracker-devel@amazon.com>"]
edition = "2024"
description = "Process for starting Firecracker in production scenarios; applies a namespace isolation barrier and then drops privileges."
homepage = "https://firecracker-microvm.github.io/"
license = "Apache-2.0"

[[bin]]
name = "jailer"
bench = false

[features]
tracing = ["log-instrument", "utils/tracing"]

[dependencies]
libc = "0.2.186"
log-instrument = { path = "../log-instrument", optional = true }
thiserror = "2.0.18"
vmm-sys-util = "0.15.0"

utils = { path = "../utils" }

[lints]
workspace = true
